<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CineVito — Perfil</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .item-menu {
    display:flex; align-items:center; gap:10px; background:var(--bg-card);
    border:1px solid #232a3a; border-radius:10px; padding:14px 16px;
    margin-bottom:10px; text-decoration:none; color:var(--text-primary); font-size:14px;
  }
</style>
</head>
<body>

<div class="container">
  <a href="catalogo.html" class="botao-voltar-topo">←</a>

  <h1 class="brand-title" style="font-size:22px; margin:0 0 20px;">Meu perfil</h1>

  <div id="cartao-perfil" style="background:var(--bg-card); border:1px solid #232a3a; border-radius:12px; padding:20px; margin-bottom:16px;">
    <div class="avatar" id="avatar-grande" style="width:56px; height:56px; font-size:22px; margin-bottom:14px; cursor:default;">?</div>
    <div style="font-size:18px; font-weight:600;" id="perfil-nome">-</div>
    <div class="texto-muted" id="perfil-email" style="margin-top:2px;">-</div>
  </div>

  <div id="cartao-editar" style="background:var(--bg-card); border:1px solid #232a3a; border-radius:12px; padding:20px; margin-bottom:16px;">
    <div class="texto-muted" style="margin-bottom:10px;">Editar minhas informações</div>
    <label style="font-size:13px; color:var(--text-muted); display:block; margin-bottom:4px;">Nome</label>
    <input type="text" id="editar-nome" class="input" placeholder="Seu nome">
    <label style="font-size:13px; color:var(--text-muted); display:block; margin-bottom:4px;">E-mail</label>
    <input type="email" id="editar-email" class="input" placeholder="Seu e-mail">
    <p class="msg-erro" id="editar-erro" style="display:none;"></p>
    <p class="texto-muted" id="editar-sucesso" style="display:none; color:var(--accent-teal);"></p>
    <button class="btn btn-primary" onclick="salvarEdicaoPerfil()">Salvar alterações</button>
  </div>

  <div id="cartao-plano" style="background:var(--bg-card); border:1px solid #232a3a; border-radius:12px; padding:20px; margin-bottom:16px;">
    <div class="texto-muted">Plano atual</div>
    <div id="perfil-plano" style="font-size:18px; font-weight:600; margin-top:4px; color:var(--accent-gold);">Carregando...</div>
    <div class="texto-muted" id="perfil-validade" style="margin-top:4px;"></div>
    <a href="assinatura.html" class="btn btn-secondary" style="margin-top:14px; padding:10px;">Gerenciar assinatura</a>
    <button class="btn btn-secondary" id="botao-cancelar-assinatura" style="display:none; margin-top:8px; padding:10px; color:var(--danger); border-color:var(--danger);" onclick="cancelarAssinatura()">Cancelar assinatura</button>
  </div>

  <a href="sugestao.html" class="item-menu">🎬 Sugerir um filme</a>
  <a href="faq.html" class="item-menu">❓ Como funciona / Perguntas frequentes</a>
  <a href="mailto:contatocinevito@gmail.com" class="item-menu">✉️ Falar com a gente</a>

  <button class="btn btn-secondary" style="margin-top:16px;" onclick="sairDoPerfil()">Sair da conta</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/perfil.js"></script>
</body>
</html>
