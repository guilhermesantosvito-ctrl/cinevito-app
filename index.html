<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CineVito — Entrar</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="screen-center">
  <div class="sprocket-strip" style="width:100%; margin-bottom:26px;"></div>

  <svg width="56" height="56" viewBox="0 0 56 56" style="margin-bottom:12px;">
    <circle cx="28" cy="28" r="26" fill="none" stroke="url(#gradIcone)" stroke-width="3"/>
    <path d="M22 18 L40 28 L22 38 Z" fill="url(#gradIcone)"/>
    <defs>
      <linearGradient id="gradIcone" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#FF8228"/>
        <stop offset="100%" stop-color="#00C8FF"/>
      </linearGradient>
    </defs>
  </svg>
  <h1 class="brand-title" style="font-size:28px; margin-bottom:4px;">CineVito</h1>
  <p class="texto-muted" style="margin-bottom:28px;">Cinema sem limites.</p>

  <div style="width:100%; max-width:340px;">

    <div id="form-login">
      <input type="email" id="login-email" class="input" placeholder="E-mail" autocomplete="off">
      <input type="password" id="login-senha" class="input" placeholder="Senha" autocomplete="new-password">
      <label style="display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text-muted); margin:-4px 0 14px;">
        <input type="checkbox" id="lembrar-email"> Lembrar meu e-mail neste aparelho
      </label>
      <p class="msg-erro" id="login-erro" style="display:none;"></p>
      <button class="btn btn-primary" onclick="fazerLogin()">Entrar</button>
      <p class="texto-muted" style="text-align:center; margin-top:16px;">
        <a href="#" onclick="recuperarSenha()" style="color:var(--accent-teal);">Esqueci minha senha</a>
      </p>
      <p class="texto-muted" style="text-align:center; margin-top:6px;">
        Não tem conta?
        <a href="#" onclick="mostrarCadastro()" style="color:var(--accent-teal);">Criar conta</a>
      </p>
    </div>

    <div id="form-cadastro" style="display:none;">
      <input type="text" id="cadastro-nome" class="input" placeholder="Seu nome">
      <input type="email" id="cadastro-email" class="input" placeholder="E-mail">
      <input type="password" id="cadastro-senha" class="input" placeholder="Crie uma senha">
      <label style="display:block; font-size:12px; color:var(--text-muted); margin:-4px 0 4px;">Data de nascimento (pra gente te dar um presente no seu aniversário 🎂)</label>
      <input type="date" id="cadastro-nascimento" class="input">
      <p class="msg-erro" id="cadastro-erro" style="display:none;"></p>
      <button class="btn btn-teal" onclick="criarConta()">Criar conta</button>
      <p class="texto-muted" style="text-align:center; margin-top:16px;">
        Já tem conta?
        <a href="#" onclick="mostrarLogin()" style="color:var(--accent-teal);">Entrar</a>
      </p>
    </div>

  </div>

  <div class="sprocket-strip" style="width:100%; margin-top:26px;"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script>

function mostrarCadastro() {
  document.getElementById("form-login").style.display = "none";
  document.getElementById("form-cadastro").style.display = "block";
}
function mostrarLogin() {
  document.getElementById("form-cadastro").style.display = "none";
  document.getElementById("form-login").style.display = "block";
}

function obterDeviceId() {
  let id = localStorage.getItem("cinevito_device_id");
  if (!id) {
    id = crypto.randomUUID();
    localStorage.setItem("cinevito_device_id", id);
  }
  return id;
}

async function fazerLogin() {
  const email = document.getElementById("login-email").value.trim();
  const senha = document.getElementById("login-senha").value;
  const erroEl = document.getElementById("login-erro");
  erroEl.style.display = "none";

  if (!email || !senha) {
    erroEl.textContent = "Preencha e-mail e senha.";
    erroEl.style.display = "block";
    return;
  }

  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password: senha });

  if (error) {
    erroEl.textContent = "E-mail ou senha incorretos.";
    erroEl.style.display = "block";
    return;
  }

  if (document.getElementById("lembrar-email").checked) {
    localStorage.setItem("cinevito_email_lembrado", email);
  } else {
    localStorage.removeItem("cinevito_email_lembrado");
  }

  window.location.href = "catalogo.html";
}

async function criarConta() {
  const nome = document.getElementById("cadastro-nome").value.trim();
  const email = document.getElementById("cadastro-email").value.trim();
  const senha = document.getElementById("cadastro-senha").value;
  const erroEl = document.getElementById("cadastro-erro");
  erroEl.style.display = "none";

  if (!nome || !email || !senha) {
    erroEl.textContent = "Preencha todos os campos.";
    erroEl.style.display = "block";
    return;
  }
  if (senha.length < 6) {
    erroEl.textContent = "A senha precisa ter pelo menos 6 caracteres.";
    erroEl.style.display = "block";
    return;
  }

  const { data, error } = await supabaseClient.auth.signUp({
    email,
    password: senha,
    options: { data: { nome } }
  });

  if (error) {
    erroEl.textContent = "Não foi possível criar a conta: " + error.message;
    erroEl.style.display = "block";
    return;
  }

  if (data.user) {
    await supabaseClient.from("profiles").insert({
      id: data.user.id,
      nome: nome,
      email: email,
      data_nascimento: document.getElementById("cadastro-nascimento").value || null
    });
    await supabaseClient.functions.invoke("registrar-acesso", {
      body: { usuario_id: data.user.id, device_id: obterDeviceId() }
    });
  }

  window.location.href = "catalogo.html";
}

async function recuperarSenha() {
  const email = document.getElementById("login-email").value.trim();
  if (!email) {
    alert("Digite seu e-mail no campo de e-mail primeiro, depois clique em 'Esqueci minha senha'.");
    return;
  }

  const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
    redirectTo: window.location.origin + "/redefinir-senha.html"
  });

  if (error) {
    alert("Não foi possível enviar o e-mail de recuperação: " + error.message);
    return;
  }

  alert("Enviamos um link para redefinir sua senha no e-mail: " + email);
}

(async () => {
  const user = await getUsuarioLogado();
  if (user) window.location.href = "catalogo.html";

  const emailLembrado = localStorage.getItem("cinevito_email_lembrado");
  if (emailLembrado) {
    document.getElementById("login-email").value = emailLembrado;
    document.getElementById("lembrar-email").checked = true;
  }
})();

</script>
</body>
</html>
