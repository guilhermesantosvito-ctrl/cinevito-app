name: Rodar Bot YouCine

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Copiar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      - name: Executar o bot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          YOUCINE_EMAIL: ${{ secrets.YOUCINE_EMAIL }}
          YOUCINE_PASSWORD: ${{ secrets.YOUCINE_PASSWORD }}
          YOUCINE_BASE_URL: "https://youcineweb.yuurw.com"
        run: python botyoucine.py