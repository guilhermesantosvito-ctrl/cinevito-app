<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CineVito — Catálogo</title>
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#080B10">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  .abas-topo {
    display:flex; gap:18px; overflow-x:auto; scrollbar-width:none;
    padding:2px 0 12px; position:sticky; top:0; background:var(--bg-primary);
    z-index:10; margin-bottom:10px;
  }
  .abas-topo::-webkit-scrollbar { display:none; }
  .aba-topo {
    white-space:nowrap; font-size:13px; color:var(--text-muted);
    text-decoration:none; padding-bottom:4px; border-bottom:2px solid transparent;
    flex-shrink:0;
  }
  .aba-topo.ativa { color:var(--text-primary); border-bottom-color:var(--accent-gold); font-weight:600; }

  .filtro-linha { display:flex; gap:8px; margin-bottom:6px; overflow-x:auto; scrollbar-width:none; }
  .filtro-linha::-webkit-scrollbar { display:none; }
  .chip-filtro {
    flex-shrink:0; padding:6px 14px; border-radius:20px; font-size:12px;
    background:var(--bg-card); border:1px solid #232a3a; color:var(--text-muted); cursor:pointer;
  }
  .chip-filtro.ativo { background:var(--accent-gold); border-color:var(--accent-gold); color:#0A0D12; font-weight:600; }

  .botao-scroll-lado {
    position:absolute; top:0; bottom:6px; width:26px; z-index:5;
    background:linear-gradient(90deg, var(--bg-primary) 40%, transparent);
    border:none; color:var(--text-primary); font-size:20px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .botao-scroll-lado.esquerda { left:-4px; }
  .botao-scroll-lado.direita {
    right:-4px;
    background:linear-gradient(270deg, var(--bg-primary) 40%, transparent);
  }
</style>
</head>
<body>

<div class="container" id="app-root">
  <div class="topbar">
    <span class="brand-title" style="font-size:18px;">CineVito</span>
    <div class="lado-direito" id="lado-direito-topbar">
      <a href="#" class="icone-topbar" onclick="sair()" title="Sair" aria-label="Sair">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
      </a>
      <div class="avatar" id="avatar-inicial">?</div>
    </div>
  </div>

  <p class="texto-muted" id="texto-boas-vindas" style="margin:-8px 0 14px; font-size:14px;"></p>

  <nav class="abas-topo" id="abas-topo"></nav>

  <div style="position:relative;">
    <button class="botao-scroll-lado esquerda" onclick="rolarFiltroGeneros(-1)">‹</button>
    <div class="filtro-linha" id="filtro-generos"></div>
    <button class="botao-scroll-lado direita" onclick="rolarFiltroGeneros(1)">›</button>
  </div>

  <div id="lista-categorias">Carregando catálogo...</div>
</div>

<div id="area-toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/instalar-app.js"></script>
<script src="js/catalog.js"></script>
</body>
</html>
